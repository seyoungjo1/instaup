name: bambu-verify
# 공개 검증 저장소(seyoungjo1/bambuverify)용 워크플로 틀 — 이 파일을 그 저장소의 .github/workflows/ 에, tools/bambu_cli.py 를 그 저장소 루트에 복사해 쓴다.
# 공개 저장소의 기본 러너는 무료라 비공개 3mf-maker 의 Actions 시간을 쓰지 않는다(사용자 지시 2026-11-04).
# 절차: 세션이 inbox/<id>/ 에 검증할 *_bambu.3mf(+ *.swaps.json)만 올려 push → 이 워크플로가 실제 Bambu Studio 로 슬라이스
#       → results/<id>/(result.json·report.md, G-code 제외) 를 커밋 → 세션이 읽고 → 끝나면 저장소를 README 한 장으로 비움.
on:
  push:
    branches: [main]
    paths: ['inbox/**']
  workflow_dispatch:
concurrency:
  group: bambu-verify
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 시스템 의존(헤드리스 GUI·AppImage)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libfuse2t64 libgl1 libegl1 libglu1-mesa libosmesa6 libgtk-3-0t64 libwebkit2gtk-4.1-0 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsecret-1-0 fonts-noto-cjk locales || true
      - name: Bambu Studio 로 열기·슬라이스(inbox 의 묶음마다, 결과가 없는 것만)
        run: |
          set +e; rc=0
          for d in inbox/*/; do
            id=$(basename "$d"); [ -f "results/$id/result.json" ] && continue
            mkdir -p "results/$id"
            python bambu_cli.py --download --files "$d"*.3mf --out "out_$id" --summary "$GITHUB_STEP_SUMMARY" > "results/$id/report.md"; r=$?
            cp "out_$id/result.json" "results/$id/result.json"; echo "$r" > "results/$id/exit_code"
            [ $r -ne 0 ] && rc=1
          done
          exit $rc
      - name: 결과 커밋
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          git diff --cached --quiet || (git commit -m 'bambu-verify: 결과' && git pull --rebase && git push)
