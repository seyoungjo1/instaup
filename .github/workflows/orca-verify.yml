name: orca-verify
# Snapmaker Orca(리눅스 AppImage, 최신 정식)로 ① U1 공식 프로필 틀 3MF 만들기(수동 실행) ② inbox_orca/<id>/*.3mf 열기·슬라이스 검증(push).
on:
  push:
    branches: [main]
    paths: ['inbox_orca/**']
  workflow_dispatch:
concurrency: { group: orca-verify, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  orca:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: 의존
        timeout-minutes: 8
        run: |
          sudo -E apt-get update -q -o Acquire::Retries=3
          sudo -E apt-get install -y -q --no-install-recommends xvfb libfuse2t64 libgl1 libegl1 libglu1-mesa libosmesa6 libgtk-3-0t64 libwebkit2gtk-4.1-0 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 libsecret-1-0 fonts-noto-cjk || true
      - name: Snapmaker Orca 받기
        run: |
          url=$(gh api repos/Snapmaker/OrcaSlicer/releases --jq '[.[] | select(.prerelease == false) | select(any(.assets[]; .name | test("Linux_AppImage.*AppImage$")))][0].assets[] | select(.name | test("Linux_AppImage.*AppImage$")) | .browser_download_url' | head -1)
          echo "ORCA_URL=$url" >> $GITHUB_ENV; mkdir -p orca && curl -sSL -o orca/orca.AppImage "$url" && chmod +x orca/orca.AppImage && (cd orca && ./orca.AppImage --appimage-extract >/dev/null)
          echo "BAMBU_STUDIO=$PWD/orca/squashfs-root/AppRun" >> $GITHUB_ENV
      - name: ① U1 틀 3MF(수동 실행일 때)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set +e; R=$PWD/results/orca-template; mkdir -p $R; P=$PWD/orca/squashfs-root/resources/profiles/Snapmaker
          python - <<'PY'
          import struct
          v=[(0,0,0),(20,0,0),(20,20,0),(0,20,0),(0,0,10),(20,0,10),(20,20,10),(0,20,10)]
          f=[(0,2,1),(0,3,2),(4,5,6),(4,6,7),(0,1,5),(0,5,4),(1,2,6),(1,6,5),(2,3,7),(2,7,6),(3,0,4),(3,4,7)]
          with open('cube.stl','w') as o:
              o.write('solid c\n')
              for a,b,c in f: o.write('facet normal 0 0 0\nouter loop\n'+''.join('vertex %g %g %g\n'%v[i] for i in (a,b,c))+'endloop\nendfacet\n')
              o.write('endsolid c\n')
          PY
          ls "$P/machine" | grep -i u1 > $R/machines.txt; ls "$P/process" | grep -i "U1 (0.4" > $R/processes.txt; ls "$P/filament" | grep -i "PLA Basic" > $R/filaments.txt
          M="$P/machine/Snapmaker U1 (0.4 nozzle).json"; PR="$P/process/0.20mm Standard @Snapmaker U1 (0.4 nozzle).json"; F="$P/filament/Snapmaker PLA Basic @U1.json"
          python - "$P" "$R" <<'PY'
          import json, os, sys, glob
          P, R = sys.argv[1], sys.argv[2]
          idx = {}
          for sub in ('machine', 'process', 'filament'):
              for f in glob.glob(os.path.join(P, sub, '*.json')) + glob.glob(os.path.join(P, '..', 'OrcaFilamentLibrary', sub, '*.json')):
                  try: d = json.load(open(f, encoding='utf-8-sig'))
                  except Exception: continue
                  idx.setdefault((sub, d.get('name', os.path.basename(f)[:-5])), d)
          def flat(sub, name):
              d = idx[(sub, name)]; out = {}
              if d.get('inherits'): out.update(flat(sub, d['inherits']))
              out.update({k: v for k, v in d.items() if k != 'inherits'})
              return out
          for sub, name, fn in [('machine', 'Snapmaker U1 (0.4 nozzle)', 'm.json'), ('process', '0.20mm Standard @Snapmaker U1 (0.4 nozzle)', 'p.json'),
                                ('process', '0.10mm Color Mixing @Snapmaker U1 (0.4 nozzle)', 'pm.json'), ('filament', 'Snapmaker PLA Basic @U1', 'f.json')]:
              d = flat(sub, name); d['from'] = 'system'; d['name'] = name
              json.dump(d, open(os.path.join(R, fn), 'w', encoding='utf-8'), ensure_ascii=False, indent=1); print(fn, len(d))
          PY
          M=$R/m.json; PR=$R/p.json; PM=$R/pm.json; F=$R/f.json
          run() { n=$1; shift; (cd $R && xvfb-run -a "$BAMBU_STUDIO" --debug 2 "$@" > log_$n.txt 2>&1; echo "exit $?" >> log_$n.txt); grep -v "\[trace\]\|\[debug\]" $R/log_$n.txt | tail -6; }
          cp cube.stl $R/cube.stl
          run a --slice 0 --export-3mf a.3mf cube.stl
          run b --load-settings "$M" --slice 0 --export-3mf b.3mf cube.stl
          python - "$R" <<'PY'
          import json, sys, os
          R = sys.argv[1]
          for src in ('m', 'p', 'pm', 'f'):
              d = json.load(open(os.path.join(R, src + '.json'), encoding='utf-8'))
              u = dict(d); u['from'] = 'User'; json.dump(u, open(os.path.join(R, src + '_u.json'), 'w'), ensure_ascii=False)
              n = {k: v for k, v in d.items() if k not in ('from', 'setting_id', 'instantiation', 'filament_id', 'inherits')}; json.dump(n, open(os.path.join(R, src + '_n.json'), 'w'), ensure_ascii=False)
          PY
          run c1 --load-settings "$R/m_u.json;$R/p_u.json" --slice 0 --export-3mf c1.3mf cube.stl
          run c2 --load-settings "$R/m_n.json;$R/p_n.json" --slice 0 --export-3mf c2.3mf cube.stl
          run c3 --load-settings "$M;$R/p_u.json" --load-filaments "$R/f_u.json;$R/f_u.json" --load-filament-ids "1" --slice 0 --export-3mf c3.3mf cube.stl
          run c4 --load-settings "$R/m_u.json;$R/pm_u.json" --load-filaments "$R/f_u.json;$R/f_u.json;$R/f_u.json;$R/f_u.json" --load-filament-ids "1" --slice 0 --export-3mf c4.3mf cube.stl
          run c --load-settings "$M;$PR" --slice 0 --export-3mf c.3mf cube.stl
          run d --load-settings "$M;$PR" --load-filaments "$F" --slice 0 --export-3mf d.3mf cube.stl
          run e --load-settings "$M;$PM" --load-filaments "$F;$F" --load-filament-ids "1" --slice 0 --export-3mf e.3mf cube.stl
          [ -f inbox_orca_probe.3mf ] && run f --allow-newer-file --slice 0 --export-3mf f.3mf $PWD/inbox_orca_probe.3mf
          (cd orca/squashfs-root/resources/profiles && tar czf $R/profiles_snapmaker.tgz Snapmaker.json Snapmaker/machine Snapmaker/process Snapmaker/filament $(ls -d OrcaFilamentLibrary* 2>/dev/null) 2>/dev/null; ls > $R/profiles_root.txt)
          echo done > $R/log.txt; ls -la $R >> $R/log.txt
      - name: ② inbox_orca 검증
        if: github.event_name == 'push'
        run: |
          set +e; rc=0
          for d in inbox_orca/*/; do id=$(basename "$d"); [ -f "results_orca/$id/result.json" ] && continue; mkdir -p "results_orca/$id"
            SLICER_EXTRA_ARGS="--allow-newer-file" python bambu_cli.py --files "$d"*.3mf --out "out_$id" > "results_orca/$id/report.md"; r=$?
            cp "out_$id/result.json" "results_orca/$id/result.json"; cp out_$id/*.png "results_orca/$id/" 2>/dev/null; echo "$r" > "results_orca/$id/exit_code"; [ $r -ne 0 ] && rc=1; done
          exit $rc
      - name: 커밋
        if: always()
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "$ORCA_URL" > /tmp/u; for d in results results_orca; do [ -e "$d" ] && git add "$d"; done; git diff --cached --quiet || (git commit -m "orca-verify: 결과 ($(basename $(cat /tmp/u)))" && git pull --rebase && git push)
