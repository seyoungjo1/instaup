# site/ → Cloudflare Pages(josseng-garage.pages.dev). 저장소 Secrets: CLOUDFLARE_API_TOKEN(Pages Edit), CLOUDFLARE_ACCOUNT_ID
name: pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=josseng-garage --branch=main --commit-dirty=true
